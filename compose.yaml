services:
  bean-journal:
    image: tzbqweas/bean-journal:1.3
    ports:
      - "8080:8080"
    volumes:
      - bean-journal-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  bean-journal-data:
